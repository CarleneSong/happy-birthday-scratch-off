<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎂 生日幸运刮刮乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#d4af37;--gold-l:#f0d878;--gold-d:#9a7d2e;--bg:#0d0b14;--ok:#4caf7d;--err:#e05555}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:#e8dcc0;min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
#stars,#confetti{position:fixed;inset:0;pointer-events:none}
#stars{z-index:0}
#confetti{z-index:200}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== 贺卡封面 ===== */
#cardScreen{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% 20%,#1c1530 0%,#0d0b14 70%)}
.card{width:min(360px,88vw);background:linear-gradient(160deg,#1d1628,#151020);border:1px solid rgba(212,175,55,.45);border-radius:20px;padding:46px 30px 40px;text-align:center;position:relative;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px rgba(212,175,55,.08);transition:transform .9s cubic-bezier(.6,0,.8,.4),opacity .9s;transform-style:preserve-3d}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(212,175,55,.2);border-radius:14px;pointer-events:none}
.card.open{transform:rotateY(75deg) scale(.65);opacity:0}
.card-dear{font-size:1.15rem;color:var(--gold-l);letter-spacing:2px;margin-bottom:20px}
.card-line{font-size:.95rem;color:#c8b898;line-height:2;margin-bottom:4px}
.card-title{font-size:1.32rem;font-weight:700;background:linear-gradient(90deg,var(--gold-d),var(--gold-l),var(--gold-d));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:28px 0;letter-spacing:3px}
.card-tap{font-size:.85rem;color:#8a7d5e;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.card-seal{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c44d3f,#8a2f26);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 4px 12px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.15)}

/* ===== 主界面 ===== */
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:38px 18px 60px;animation:fadein 1s}
.main-title{text-align:center;font-size:1.45rem;background:linear-gradient(90deg,var(--gold-d),var(--gold-l),var(--gold-d));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;cursor:default}
.main-sub{text-align:center;color:#8a7d5e;font-size:.85rem;margin:10px 0 20px;letter-spacing:1px}
.progress{display:flex;justify-content:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.progress .dot{width:9px;height:9px;border-radius:50%;background:#2a2438;border:1px solid rgba(212,175,55,.25)}
.progress .dot.on{background:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.6)}
.ticket{position:relative;background:linear-gradient(160deg,#1b1526,#131019);border:1px solid rgba(212,175,55,.5);border-radius:20px;padding:24px 16px 20px;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid rgba(212,175,55,.5);transform:translateY(-50%)}
.ticket::before{left:-9px}
.ticket::after{right:-9px}
.ticket-head{text-align:center;color:var(--gold);font-size:.75rem;letter-spacing:5px;margin-bottom:18px;opacity:.8}
.icons-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.icon-cell{position:relative;aspect-ratio:1;background:linear-gradient(160deg,#241c33,#1a1526);border:1px solid rgba(212,175,55,.35);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:hidden}
.icon-cell:not(.done):not(.locked):hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(212,175,55,.15)}
.icon-emoji{font-size:2rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.icon-num{position:absolute;top:5px;left:8px;font-size:.65rem;color:rgba(212,175,55,.5)}
.icon-cell.done{border-color:rgba(76,175,125,.5);background:linear-gradient(160deg,#15241d,#101a15)}
.icon-done-mark{position:absolute;top:4px;right:6px;color:var(--ok);font-size:.85rem;font-weight:700}
.icon-cell.locked .icon-emoji{opacity:.5;filter:grayscale(.3)}
.icon-lock{position:absolute;top:4px;right:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:.6rem;z-index:3;background:rgba(10,10,20,.8);border-radius:50%;border:1px solid rgba(212,175,55,.35)}
.ticket-foot{text-align:center;color:#6d6350;font-size:.72rem;margin-top:18px;letter-spacing:2px}

/* ===== 破解进度总览 ===== */
.tracker{margin-top:24px;background:linear-gradient(160deg,#1b1526,#131019);border:1px solid rgba(212,175,55,.35);border-radius:16px;padding:18px 16px 8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tracker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:10px;border-bottom:1px solid rgba(212,175,55,.25)}
.tracker-title{font-size:.9rem;color:var(--gold-l);letter-spacing:2px}
.tracker-count{font-size:1.05rem;font-weight:700;color:var(--gold)}
.tracker-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(212,175,55,.12);font-size:.85rem}
.tracker-row:last-child{border-bottom:none}
.tr-row-icon{font-size:1.05rem;width:26px;text-align:center;flex-shrink:0}
.tr-row-label{flex:1;color:#c8b898;letter-spacing:1px}
.tr-row-status{font-size:.78rem;letter-spacing:1px;flex-shrink:0}
.tracker-row.done .tr-row-status{color:var(--ok);font-weight:600}
.tracker-row.done .tr-row-prize{color:var(--gold-l);font-weight:600}
.tracker-row.locked .tr-row-status{color:#6d6350}
.tracker-row.pending .tr-row-status{color:#8a7d5e}
.tr-row-prize{color:#8a7d5e}

/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;z-index:110;background:rgba(5,4,10,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadein .3s}
.modal-box{background:linear-gradient(165deg,#1d1728,#141019);border:1px solid rgba(212,175,55,.45);border-radius:18px;padding:22px 20px;width:min(430px,94vw);max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(212,175,55,.2)}
.modal-head .ic{font-size:1.4rem}
.modal-head .tt{flex:1;font-size:1.05rem;color:var(--gold-l);letter-spacing:1px}
.close-btn{background:none;border:none;color:#8a7d5e;font-size:1rem;cursor:pointer;padding:4px 8px}
.puzzle-body{font-size:.92rem;color:#d8cba8;line-height:1.9}
.puzzle-body .hl{color:var(--gold-l)}
.puzzle-body .code{display:block;background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.15);border-radius:10px;padding:10px 14px;margin:10px 0;letter-spacing:3px;color:#f0e6c8;font-size:.95rem;text-align:center;white-space:pre-line}
.answer-row{display:flex;gap:10px;margin-top:18px}
.answer-input{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.4);border-radius:10px;padding:11px 14px;color:#f0e6c8;font-size:1rem;outline:none;letter-spacing:2px;min-width:0}
.answer-input:focus{border-color:var(--gold)}
.submit-btn{background:linear-gradient(135deg,var(--gold-d),var(--gold));border:none;border-radius:10px;padding:0 20px;color:#1a1508;font-weight:700;cursor:pointer;font-size:.95rem}
.submit-btn:active{transform:scale(.96)}
.feedback{text-align:center;margin-top:12px;font-size:.9rem;min-height:1.2em}
.feedback.ok{color:var(--ok)}
.feedback.err{color:var(--err)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 奖励 / 终极 / 密钥 */
.reward-box{text-align:center}
.reward-emoji{font-size:3.4rem;margin-bottom:8px;animation:bounceIn .6s}
@keyframes bounceIn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.reward-name{font-size:1.25rem;color:var(--gold-l);margin-bottom:10px;letter-spacing:2px}
.reward-desc{font-size:.95rem;color:#c8b898;line-height:1.8;margin-bottom:20px;white-space:pre-line}
.collect-btn{background:linear-gradient(135deg,#c44d3f,#e07060);border:none;border-radius:24px;padding:12px 38px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;letter-spacing:2px}
.collect-btn:active{transform:scale(.96)}
.key-box{text-align:center}
.key-hint{font-size:.85rem;color:#8a7d5e;margin:6px 0 16px}
.final-box{text-align:center}
.final-emoji{font-size:3.2rem;margin-bottom:10px}
.final-title{font-size:1.3rem;color:var(--gold-l);margin-bottom:14px;letter-spacing:2px}
.final-text{font-size:.95rem;color:#d8cba8;line-height:2;white-space:pre-line;margin-bottom:20px}

/* 猪圈密码 */
.pigpen-ref{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;justify-items:center;margin:12px 0;padding:14px 10px;background:rgba(0,0,0,.3);border-radius:12px;border:1px solid rgba(212,175,55,.15)}
.pigpen-cipher{display:flex;gap:16px;justify-content:center;margin:14px 0;padding:14px;background:rgba(0,0,0,.3);border-radius:12px;border:1px solid rgba(212,175,55,.15)}

/* 配置错误提示 */
.cfg-error{text-align:center;padding:60px 20px;color:#c8b898;line-height:2}
.cfg-error code{color:var(--gold-l)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="confetti"></canvas>

<!-- 贺卡封面 -->
<div id="cardScreen">
  <div class="card" id="theCard" onclick="openCard()">
    <div class="card-dear" id="cardDear"></div>
    <div class="card-line" id="cardLines"></div>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-tap" id="cardTap"></div>
    <div class="card-seal" id="cardSeal">❤</div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <h1 class="main-title" id="mainTitle"></h1>
  <p class="main-sub" id="mainSub"></p>
  <div class="progress" id="progressBar"></div>
  <div class="ticket">
    <div class="ticket-head" id="ticketHead"></div>
    <div class="icons-grid" id="iconsGrid"></div>
    <div class="ticket-foot" id="ticketFoot"></div>
  </div>
  <div class="tracker" id="tracker"></div>
</div>

<!-- 谜题弹窗 -->
<div class="modal hidden" id="puzzleModal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="ic" id="mIcon"></span>
      <span class="tt" id="mTitle"></span>
      <button class="close-btn" onclick="closePuzzle()">✕</button>
    </div>
    <div class="puzzle-body" id="mBody"></div>
    <div class="answer-row">
      <input type="text" id="ansInput" class="answer-input" placeholder="输入兑换码…" onkeydown="if(event.key==='Enter')checkAnswer()">
      <button class="submit-btn" onclick="checkAnswer()">兑换</button>
    </div>
    <div class="feedback" id="mFeedback"></div>
  </div>
</div>

<!-- 密钥弹窗 -->
<div class="modal hidden" id="keyModal">
  <div class="modal-box key-box">
    <div class="modal-head">
      <span class="ic">🔒</span>
      <span class="tt">输入解锁密钥</span>
      <button class="close-btn" onclick="document.getElementById('keyModal').classList.add('hidden')">✕</button>
    </div>
    <p class="key-hint" id="keyHint"></p>
    <div class="answer-row">
      <input type="text" id="keyInput" class="answer-input" placeholder="输入密钥…" onkeydown="if(event.key==='Enter')verifyKey()">
      <button class="submit-btn" onclick="verifyKey()">解锁</button>
    </div>
    <div class="feedback" id="keyFeedback"></div>
  </div>
</div>

<!-- 奖励弹窗 -->
<div class="modal hidden" id="rewardModal">
  <div class="modal-box reward-box">
    <div class="reward-emoji" id="rEmoji"></div>
    <div class="reward-name" id="rName"></div>
    <div class="reward-desc" id="rDesc"></div>
    <button class="collect-btn" onclick="collectReward()">收下 🎉</button>
  </div>
</div>

<!-- 终极弹窗 -->
<div class="modal hidden" id="finalModal">
  <div class="modal-box final-box">
    <div class="final-emoji">🎉</div>
    <div class="final-title" id="finalTitle"></div>
    <div class="final-text" id="finalText"></div>
    <button class="collect-btn" onclick="document.getElementById('finalModal').classList.add('hidden')">完成 🎂</button>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
 * 生日幸运刮刮乐 · 通用引擎
 * 所有内容（贺卡文案 / 谜题 / 礼物 / 密钥）都在 config.js 里配置
 * 本文件一般不需要修改
 * ============================================================ */

// ===== 读取配置（config.js 中定义 window.BDAY_CONFIG）=====
const CFG = Object.assign({
  title: '🎂 生日幸运刮刮乐',
  subtitle: '刮开幸运格 · 破解谜题 · 领取惊喜',
  ticketHead: '✦ LUCKY SCRATCH ✦',
  ticketFoot: '刮开涂层 · 破解密码 · 输入兑换码领取礼物',
  card: {
    dear: '亲爱的朋友：',
    lines: ['祝你生日快乐。', '我为你准备了几份小小的心意，<br>都藏在这一页之后。'],
    title: '🎂 生日幸运刮刮乐 🎂',
    tap: '👆 轻轻点开'
  },
  unlockKey: null,          // 解锁密钥（如 "0815"）；null = 全部直接可玩
  keyHint: '密钥不藏在这页纸上——想解锁，当面找我要 🔑',
  keyHintFirst: '先刮开第 1 格，开始你的冒险',
  finalTitle: '全部惊喜已解锁！',
  finalMessage: '恭喜你解锁了全部惊喜！🎂',
  storageKey: 'bday_scratch_v1',  // 本地进度存储键（换一套配置请换一个 key）
  puzzles: []
}, window.BDAY_CONFIG || {});

const PUZZLES = CFG.puzzles;
const N = PUZZLES.length;
const USE_KEY = !!CFG.unlockKey;

// ===== 静态文案渲染 =====
document.title = CFG.title.replace(/^[^\u4e00-\u9fa5\w]+/, '').trim() || CFG.title;
document.getElementById('cardDear').textContent = CFG.card.dear;
document.getElementById('cardLines').innerHTML = (CFG.card.lines || []).join('<br>');
document.getElementById('cardTitle').textContent = CFG.card.title;
document.getElementById('cardTap').textContent = CFG.card.tap;
document.getElementById('mainTitle').textContent = CFG.title;
document.getElementById('mainSub').textContent = CFG.subtitle;
document.getElementById('ticketHead').textContent = CFG.ticketHead;
document.getElementById('ticketFoot').textContent = CFG.ticketFoot;
document.getElementById('finalTitle').textContent = CFG.finalTitle;

let solvedCount = 0, curP = -1;
const solved = new Array(N).fill(false);
const locked = new Array(N).fill(USE_KEY);
locked[0] = false; // 第1格默认解锁

// ===== 星空背景 =====
!function(){
  const c=document.getElementById('stars'),ctx=c.getContext('2d');
  let S=[];
  function rs(){c.width=innerWidth;c.height=innerHeight;S=[];for(let i=0;i<80;i++)S.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.3,a:Math.random()*.5+.1,s:Math.random()*.02+.005})}
  rs();addEventListener('resize',rs);
  function lp(){ctx.clearRect(0,0,c.width,c.height);S.forEach(s=>{s.a+=s.s*(Math.random()>.5?1:-1);if(s.a<.05)s.a=.05;if(s.a>.6)s.a=.6;ctx.fillStyle=`rgba(212,175,55,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(lp)}lp();
}();

// ===== 进度自动保存（刷新不丢失，按设备独立存储）=====
function saveState(){
  try{localStorage.setItem(CFG.storageKey,JSON.stringify({cardOpened,solved,locked}))}catch(e){}
}
function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(CFG.storageKey));
    if(s&&Array.isArray(s.solved)){
      cardOpened=!!s.cardOpened;
      for(let i=0;i<N;i++){
        solved[i]=!!s.solved[i];
        if(Array.isArray(s.locked))locked[i]=!!s.locked[i];
      }
      locked[0]=false;
      solvedCount=solved.filter(Boolean).length;
    }
  }catch(e){}
}

// ===== 贺卡翻页 =====
let cardOpened=false;
function openCard(){
  if(cardOpened)return;cardOpened=true;
  document.getElementById('theCard').classList.add('open');
  setTimeout(()=>{
    document.getElementById('cardScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    buildIcons();
  },850);
}

// ===== 猪圈密码SVG（经典布局：3x3 A-I / 带点 J-R / X阵 STUV / 带点 WXYZ）=====
function pigpen(L,sz){
  const s=sz||44,m=s*.16,c=s/2;let p='',dot=false;L=L.toUpperCase();
  if('ABCDEFGHI'.includes(L)){
    const i=L.charCodeAt(0)-65,r=Math.floor(i/3),cc=i%3;
    if(r===0)p+=`M${m} ${m}L${s-m} ${m} `;
    if(r===2)p+=`M${m} ${s-m}L${s-m} ${s-m} `;
    if(cc===0)p+=`M${m} ${m}L${m} ${s-m} `;
    if(cc===2)p+=`M${s-m} ${m}L${s-m} ${s-m} `;
    if(r===1&&cc===1)p+=`M${m} ${m}L${s-m} ${m} M${m} ${s-m}L${s-m} ${s-m} M${m} ${m}L${m} ${s-m} M${s-m} ${m}L${s-m} ${s-m} `;
  }else if('JKLMNOPQR'.includes(L)){
    const i=L.charCodeAt(0)-74,r=Math.floor(i/3),cc=i%3;
    if(r===0)p+=`M${m} ${m}L${s-m} ${m} `;
    if(r===2)p+=`M${m} ${s-m}L${s-m} ${s-m} `;
    if(cc===0)p+=`M${m} ${m}L${m} ${s-m} `;
    if(cc===2)p+=`M${s-m} ${m}L${s-m} ${s-m} `;
    if(r===1&&cc===1)p+=`M${m} ${m}L${s-m} ${m} M${m} ${s-m}L${s-m} ${s-m} M${m} ${m}L${m} ${s-m} M${s-m} ${m}L${s-m} ${s-m} `;
    dot=true;
  }else if('STUV'.includes(L)){
    const i=L.charCodeAt(0)-83;
    if(i===0)p+=`M${m} ${m}L${c} ${c} M${c} ${c}L${s-m} ${m} `;
    else if(i===1)p+=`M${s-m} ${m}L${c} ${c} M${c} ${c}L${s-m} ${s-m} `;
    else if(i===2)p+=`M${m} ${s-m}L${c} ${c} M${c} ${c}L${s-m} ${s-m} `;
    else p+=`M${m} ${m}L${c} ${c} M${c} ${c}L${m} ${s-m} `;
  }else if('WXYZ'.includes(L)){
    const i=L.charCodeAt(0)-87;
    if(i===0)p+=`M${m} ${m}L${c} ${c} M${c} ${c}L${s-m} ${m} `;
    else if(i===1)p+=`M${s-m} ${m}L${c} ${c} M${c} ${c}L${s-m} ${s-m} `;
    else if(i===2)p+=`M${m} ${s-m}L${c} ${c} M${c} ${c}L${s-m} ${s-m} `;
    else p+=`M${m} ${m}L${c} ${c} M${c} ${c}L${m} ${s-m} `;
    dot=true;
  }
  const dc=dot?`<circle cx="${c}" cy="${c}" r="${s*.07}" fill="#d4af37"/>`:'';
  return `<svg viewBox="0 0 ${s} ${s}" width="${sz||44}" height="${sz||44}"><path d="${p}" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${dc}</svg>`;
}
function ppGrid9(dotted,letters){
  const s=100,m=10,cs=(s-2*m)/3;let p='',txt='';
  for(let i=0;i<=3;i++){const x=m+i*cs;p+=`M${x} ${m}L${x} ${s-m} M${m} ${x}L${s-m} ${x} `}
  letters.forEach((L,i)=>{
    const r=Math.floor(i/3),cc=i%3,cx=m+cc*cs+cs/2,cy=m+r*cs+cs/2;
    txt+=`<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" fill="#c8b898">${L}</text>`;
    if(dotted)txt+=`<circle cx="${cx}" cy="${cy+12}" r="2.2" fill="#8a7d5e"/>`;
  });
  return `<svg viewBox="0 0 ${s} ${s}" width="100%" style="max-width:120px"><path d="${p}" stroke="#d4af37" stroke-width="1.6" fill="none"/>${txt}</svg>`;
}
function ppGridX(dotted,letters){
  const s=100,m=10,c2=s/2;
  const p=`M${m} ${m}L${s-m} ${m} M${m} ${s-m}L${s-m} ${s-m} M${m} ${m}L${m} ${s-m} M${s-m} ${m}L${s-m} ${s-m} M${m} ${m}L${s-m} ${s-m} M${s-m} ${m}L${m} ${s-m}`;
  const pos=[[c2,m+24],[s-m-19,c2+5],[c2,s-m-11],[m+19,c2+5]];
  let txt='';
  letters.forEach((L,i)=>{txt+=`<text x="${pos[i][0]}" y="${pos[i][1]}" text-anchor="middle" font-size="15" fill="#c8b898">${L}</text>`;if(dotted)txt+=`<circle cx="${pos[i][0]}" cy="${pos[i][1]+9}" r="2.2" fill="#8a7d5e"/>`});
  return `<svg viewBox="0 0 ${s} ${s}" width="100%" style="max-width:120px"><path d="${p}" stroke="#d4af37" stroke-width="1.6" fill="none"/>${txt}</svg>`;
}
function buildPigpenRef(){
  return ppGrid9(false,'ABCDEFGHI'.split(''))+ppGrid9(true,'JKLMNOPQR'.split(''))+ppGridX(false,'STUV'.split(''))+ppGridX(true,'WXYZ'.split(''));
}
function buildPigpenCipher(word){let h='';for(const l of word.toUpperCase())h+=pigpen(l,44);return h}

// ===== 图标网格 =====
function buildIcons(){
  const g=document.getElementById('iconsGrid');g.innerHTML='';
  PUZZLES.forEach((p,i)=>{
    const cell=document.createElement('div');
    cell.className='icon-cell'+(solved[i]?' done':'')+(locked[i]?' locked':'');
    cell.id='cell-'+i;
    cell.innerHTML=`<span class="icon-num">${i+1}</span><div class="icon-emoji">${p.icon}</div>${solved[i]?'<span class="icon-done-mark">✓</span>':''}${locked[i]?'<div class="icon-lock">🔒</div>':''}`;
    g.appendChild(cell);
    if(solved[i]||locked[i]){
      cell.addEventListener('click',()=>{if(locked[i])openKeyModal()});
    }else{
      initScratch(cell,i);
    }
  });
  buildProgress();
  buildTracker();
}
function buildProgress(){
  const b=document.getElementById('progressBar');b.innerHTML='';
  for(let i=0;i<N;i++){const d=document.createElement('span');d.className='dot'+(solved[i]?' on':'');b.appendChild(d)}
}

// ===== 破解进度总览（制作者可借此查看对方进度）=====
function buildTracker(){
  const t=document.getElementById('tracker');if(!t)return;
  let h=`<div class="tracker-head"><span class="tracker-title">✦ 破解进度总览 ✦</span><span class="tracker-count">${solvedCount} / ${N}</span></div>`;
  PUZZLES.forEach((p,i)=>{
    let cls='pending',status='⏳ 待破解',prize='';
    if(solved[i]){cls='done';status='✅ 已破解';prize=`<span class="tr-row-prize">· ${p.prize||''}</span>`}
    else if(locked[i]){cls='locked';status='🔒 未解锁'}
    h+=`<div class="tracker-row ${cls}"><span class="tr-row-icon">${p.icon}</span><span class="tr-row-label">第${i+1}格 · ${p.label||''}</span>${prize}<span class="tr-row-status">${status}</span></div>`;
  });
  t.innerHTML=h;
}

// ===== 刮刮乐涂层 =====
function initScratch(cell,idx){
  const old=cell.querySelector('canvas');if(old)old.remove();
  const canvas=document.createElement('canvas');
  const sz=cell.offsetWidth||90;
  canvas.width=sz;canvas.height=sz;
  canvas.style.cssText='position:absolute;inset:0;z-index:2;width:100%;height:100%;border-radius:14px';
  cell.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  const g=ctx.createLinearGradient(0,0,sz,sz);
  g.addColorStop(0,'#3a2f55');g.addColorStop(.5,'#4a3d6a');g.addColorStop(1,'#2a2240');
  ctx.fillStyle=g;ctx.fillRect(0,0,sz,sz);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=(sz*.32)+'px sans-serif';
  ctx.fillText(PUZZLES[idx].icon,sz/2,sz/2-sz*.08);
  ctx.font='bold '+(sz*.1)+'px sans-serif';
  ctx.fillStyle='rgba(212,175,55,.45)';
  ctx.fillText('刮 开',sz/2,sz/2+sz*.26);
  let scr=false,rev=false;
  function gp(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)}}
  function doScratch(e){if(rev)return;e.preventDefault();const p=gp(e);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.fill()}
  function chk(){if(rev)return;const d=ctx.getImageData(0,0,sz,sz).data;let cl=0;for(let i=3;i<d.length;i+=4)if(d[i]<50)cl++;if(cl/(d.length/4)>.4){rev=true;canvas.style.transition='opacity .4s';canvas.style.opacity='0';setTimeout(()=>{canvas.remove();cell.addEventListener('click',()=>openPuzzle(idx));openPuzzle(idx)},400)}}
  canvas.addEventListener('mousedown',e=>{scr=true;doScratch(e)});
  canvas.addEventListener('mousemove',e=>{if(scr)doScratch(e)});
  canvas.addEventListener('mouseup',()=>{scr=false;chk()});
  canvas.addEventListener('mouseleave',()=>{scr=false;chk()});
  canvas.addEventListener('touchstart',e=>{scr=true;doScratch(e)},{passive:false});
  canvas.addEventListener('touchmove',e=>{if(scr)doScratch(e)},{passive:false});
  canvas.addEventListener('touchend',()=>{scr=false;chk()});
}

// ===== 谜题弹窗 =====
function openPuzzle(idx){
  if(solved[idx])return;
  if(locked[idx]){openKeyModal();return}
  curP=idx;
  const p=PUZZLES[idx];
  document.getElementById('mIcon').textContent=p.icon;
  document.getElementById('mTitle').textContent=`第${idx+1}格 · ${p.label||''}`;
  document.getElementById('mBody').innerHTML=p.body;
  document.getElementById('ansInput').value='';
  document.getElementById('mFeedback').textContent='';
  document.getElementById('mFeedback').className='feedback';
  document.getElementById('puzzleModal').classList.remove('hidden');
  if(p.pigpenWord){
    const r=document.getElementById('pigpenRef');if(r)r.innerHTML=buildPigpenRef();
    const c=document.getElementById('pigpenCipher');if(c)c.innerHTML=buildPigpenCipher(p.pigpenWord);
  }
  setTimeout(()=>document.getElementById('ansInput').focus(),300);
}
function closePuzzle(){document.getElementById('puzzleModal').classList.add('hidden')}
function norm(v){return (v||'').replace(/\s+/g,'').toLowerCase()}
function checkAnswer(){
  const v=norm(document.getElementById('ansInput').value);
  const fb=document.getElementById('mFeedback');
  if(!v){fb.textContent='请输入兑换码';fb.className='feedback err';return}
  const p=PUZZLES[curP];
  if((p.answers||[]).some(a=>norm(a)===v)){
    fb.textContent='✓ 兑换码正确！';
    fb.className='feedback ok';
    setTimeout(()=>showReward(curP),800);
  }else{
    fb.textContent='✗ 不对哦，再想想…';
    fb.className='feedback err';
    const inp=document.getElementById('ansInput');
    inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),300);
  }
}

// ===== 密钥解锁 =====
function openKeyModal(){
  document.getElementById('keyInput').value='';
  document.getElementById('keyFeedback').textContent='';
  document.getElementById('keyFeedback').className='feedback';
  document.getElementById('keyHint').textContent=solved[0]?CFG.keyHint:CFG.keyHintFirst;
  document.getElementById('keyModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('keyInput').focus(),300);
}
function verifyKey(){
  const v=norm(document.getElementById('keyInput').value);
  const fb=document.getElementById('keyFeedback');
  if(!v){fb.textContent='请输入密钥';fb.className='feedback err';return}
  if(v===norm(CFG.unlockKey)){
    fb.textContent='✓ 密钥正确！全部解锁！';
    fb.className='feedback ok';
    setTimeout(()=>{
      document.getElementById('keyModal').classList.add('hidden');
      for(let i=0;i<N;i++)locked[i]=false;
      buildIcons();
      saveState();
      confetti(60,2500);
    },900);
  }else{
    fb.textContent='✗ 密钥不对哦…';
    fb.className='feedback err';
    const inp=document.getElementById('keyInput');
    inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),300);
  }
}

// ===== 奖励揭晓 =====
function showReward(idx){
  document.getElementById('puzzleModal').classList.add('hidden');
  const p=PUZZLES[idx];
  document.getElementById('rEmoji').textContent=p.icon;
  document.getElementById('rName').textContent=p.label||'';
  document.getElementById('rDesc').textContent=p.reward||'';
  document.getElementById('rewardModal').classList.remove('hidden');
  confetti(40,2000);
}
function collectReward(){
  document.getElementById('rewardModal').classList.add('hidden');
  solved[curP]=true;solvedCount++;
  saveState();
  const cell=document.getElementById('cell-'+curP);
  cell.classList.add('done');
  cell.innerHTML=`<span class="icon-num">${curP+1}</span><div class="icon-emoji">${PUZZLES[curP].icon}</div><span class="icon-done-mark">✓</span>`;
  buildProgress();
  buildTracker();
  if(solvedCount>=N)setTimeout(showFinal,600);
}
function showFinal(){
  document.getElementById('finalText').textContent=CFG.finalMessage;
  document.getElementById('finalModal').classList.remove('hidden');
  confetti(150,5000);
}

// ===== 撒花 =====
function confetti(amt,dur){
  const c=document.getElementById('confetti'),ctx=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;
  const cols=['#d4af37','#f0d878','#c44d3f','#e8d5b5','#4caf7d','#e05555','#ff6b9d'];
  const emo=['🎉','✨','🎊','⭐','🎂','❤️','💫'];
  const ps=[];
  for(let i=0;i<amt;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*4,vy:Math.random()*3+2,sz:Math.random()*8+4,col:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*360,vr:(Math.random()-.5)*10,em:Math.random()>.7?emo[Math.floor(Math.random()*emo.length)]:null,life:1});
  const st=Date.now();
  function lp(){
    const el=Date.now()-st;ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.rot+=p.vr;if(p.y>c.height)p.life-=.02;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);if(p.em){ctx.font=p.sz*2+'px sans-serif';ctx.fillText(p.em,-p.sz,p.sz)}else{ctx.fillStyle=p.col;ctx.globalAlpha=p.life;ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.6)}ctx.restore()});
    if(el<dur&&ps.some(p=>p.life>0))requestAnimationFrame(lp);else ctx.clearRect(0,0,c.width,c.height);
  }
  lp();
}

// ===== 弹窗背景点击关闭（奖励/终极除外）=====
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m&&m.id!=='finalModal'&&m.id!=='rewardModal')m.classList.add('hidden')});
});

// ===== 隐藏重置：连点主标题5次（制作者测试用）=====
!function(){
  const h=document.getElementById('mainTitle');if(!h)return;
  let n=0,t=0;
  h.addEventListener('click',()=>{
    const now=Date.now();if(now-t>2500)n=0;t=now;n++;
    if(n>=5){if(confirm('重置全部进度？')){try{localStorage.removeItem(CFG.storageKey)}catch(e){}location.reload()}}
  });
}();

// ===== 启动：校验配置 + 恢复进度 =====
loadState();
if(N===0){
  document.getElementById('cardScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('iconsGrid').innerHTML=`<div class="cfg-error" style="grid-column:1/-1">⚠️ 未找到谜题配置<br>请在页面同级目录创建 <code>config.js</code>，<br>并定义 <code>window.BDAY_CONFIG</code>（可参考示例配置）</div>`;
}else if(cardOpened){
  document.getElementById('cardScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildIcons();
}
</script>
